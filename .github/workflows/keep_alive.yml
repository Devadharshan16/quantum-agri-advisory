name: Keep Render Backend Awake

on:
  schedule:
    # Runs every 14 minutes (Render sleeps after 15 minutes of inactivity)
    - cron: '*/14 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend
        run: |
          # Replace URL with your actual Render deployment URL or set BACKEND_URL secret in GitHub repo settings
          TARGET_URL="${{ secrets.BACKEND_URL || 'https://quantum-crop-api.onrender.com' }}"
          echo "Pinging $TARGET_URL/docs ..."
          curl -s -o /dev/null -w "HTTP Status: %{http_code}\n" "$TARGET_URL/docs" || true
